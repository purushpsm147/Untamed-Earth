name: Experimental spatial query baseline
on:
  push:
    branches:
      - experiment/spatial-query-baseline
  workflow_dispatch:
jobs:
  spatial-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck all benchmark fixtures
        run: npm run typecheck
      - name: Compare deterministic static-ray fixtures with strict distance/hit parity
        run: npm run bench:spatial -- --quick --out=docs/evidence/tech-experiments/spatial-baseline-ci.json
      - name: Install pinned BVH probe independently of production workspaces
        run: npm install --prefix experiments/spatial-bvh --no-audit --no-fund --package-lock=false
      - name: Run exact-triangle native versus BVH query comparison
        run: node experiments/spatial-bvh/run.mjs --quick --out=docs/evidence/tech-experiments/bvh-probe-ci.json
      - name: Compare BVH and native queries on actual streaming valley chunk geometry
        run: npx tsx experiments/spatial-bvh/valley-bvh.mjs --quick --out=docs/evidence/tech-experiments/valley-bvh-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-baseline-quick
          path: |
            docs/evidence/tech-experiments/spatial-baseline-ci.json
            docs/evidence/tech-experiments/bvh-probe-ci.json
            docs/evidence/tech-experiments/valley-bvh-ci.json
          retention-days: 14
