name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: untamed-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test-build-browser:
    name: Typecheck, headless ecology, build, browser smoke
    runs-on: ubuntu-latest
    # ~2 min unit/headless + ~12 min browser suites on a software renderer, with headroom
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Headless and unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      # Capture experiment evidence before unrelated gameplay tests that can be
      # timing-sensitive under SwiftShader. Both remain mandatory CI stages.
      - name: Visual naturalism 720p/1080p A/B screenshots (SwiftShader)
        if: github.head_ref == 'experiment/gemini-natural-riverbank' || github.ref_name == 'experiment/gemini-natural-riverbank'
        run: npx playwright test --project=naturalism --project=naturalism-v3
      - name: Browser smoke, reliability and gameplay suites (software renderer)
        run: npm run test:e2e -- --trace retain-on-failure
      - name: Upload Playwright reports, if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            test-artifacts/playwright/
            test-results/naturalism-slice/
            docs/evidence/slice1-v3/
          if-no-files-found: ignore
          retention-days: 7
